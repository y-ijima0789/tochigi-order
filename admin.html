<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>注文管理 | 栃木建築社</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --ink: #1a1510; --ink-light: #5a5248; --ink-muted: #9a9290;
    --paper: #faf8f4; --paper-warm: #f2ede4; --paper-mid: #e8e2d8;
    --accent: #6b4c2a; --accent-light: #c8a882; --accent-subtle: #f0e8da;
    --green: #3a5a3a; --green-bg: #edf4ed; --green-border: rgba(58,90,58,0.25);
    --border: rgba(107,76,42,0.18); --r: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: var(--paper); color: var(--ink); font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }

  .header {
    background: var(--green); color: var(--paper);
    padding: 1.25rem 1.25rem 1rem; position: sticky; top: 0; z-index: 10;
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .header-title { font-family: 'Noto Serif JP', serif; font-size: 17px; font-weight: 500; letter-spacing: 0.08em; }
  .notif-btn {
    padding: 6px 14px; border-radius: 999px; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.4); background: transparent;
    color: rgba(255,255,255,0.9); cursor: pointer;
  }
  .notif-btn.on { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.7); }
  .header-sub { font-size: 11px; color: rgba(255,255,255,0.6); }

  .tab-bar {
    display: flex; background: var(--paper-warm);
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 1; text-align: center; padding: 12px 8px;
    font-size: 13px; cursor: pointer; color: var(--ink-muted);
    border-bottom: 2px solid transparent; transition: all 0.15s;
  }
  .tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 500; }
  .tab-badge {
    display: inline-block; background: #e05a5a; color: white;
    border-radius: 999px; font-size: 10px; padding: 1px 6px;
    margin-left: 4px; font-weight: 500; vertical-align: middle;
  }

  .content { padding: 1rem 1rem 4rem; }
  .empty { text-align: center; padding: 4rem 1rem; color: var(--ink-muted); font-size: 14px; }
  .empty-icon { font-size: 36px; margin-bottom: 1rem; }

  .order-card {
    background: var(--paper); border: 1px solid var(--border);
    border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px;
    transition: opacity 0.3s;
  }
  .order-card.new-order { border-left: 3px solid var(--green); }
  .order-card.done { opacity: 0.5; }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  .card-item { display: flex; align-items: center; gap: 10px; }
  .card-icon { font-size: 26px; }
  .card-name { font-size: 16px; font-weight: 500; color: var(--ink); }
  .card-temp { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
  .card-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .badge-new {
    font-size: 10px; padding: 3px 10px; border-radius: 999px; font-weight: 500;
    background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border);
  }
  .badge-done {
    font-size: 10px; padding: 3px 10px; border-radius: 999px;
    background: var(--paper-mid); color: var(--ink-muted);
  }
  .card-qty { font-size: 13px; color: var(--ink-light); font-weight: 400; }

  .card-note {
    font-size: 12px; color: var(--ink-light); background: var(--paper-warm);
    border-radius: 6px; padding: 7px 10px; margin-top: 8px;
  }
  .card-time { font-size: 11px; color: var(--ink-muted); margin-top: 8px; }

  .done-btn {
    width: 100%; margin-top: 10px; padding: 9px;
    border: 1px solid var(--green-border); border-radius: var(--r);
    background: var(--green-bg); color: var(--green);
    font-size: 13px; cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
    font-weight: 500; transition: background 0.15s;
  }
  .done-btn:active { background: #d5e8d5; }

  .new-banner {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: white;
    padding: 10px 20px; border-radius: 999px;
    font-size: 13px; font-weight: 500;
    animation: slideDown 0.3s ease;
    z-index: 100; white-space: nowrap;
  }
  @keyframes slideDown { from { transform: translateX(-50%) translateY(-20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-title">注文管理画面</div>
    <button class="notif-btn" id="notif-btn" onclick="requestNotif()">🔔 通知オン</button>
  </div>
  <div class="header-sub" id="header-sub">リアルタイムで注文を受信中...</div>
</div>

<div class="tab-bar">
  <div class="tab active" id="tab-new" onclick="switchTab('new')">新着 <span class="tab-badge" id="new-count" style="display:none"></span></div>
  <div class="tab" id="tab-all" onclick="switchTab('all')">すべて</div>
</div>

<div class="content" id="content"></div>

<script>
const SUPABASE_URL = 'https://jdykbvsvvbrdrfrffwwa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkeWtidnN2dmJyZHJmcmZmd3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyODQ4OTMsImV4cCI6MjA5MDg2MDg5M30.rYE4w0j2WBGhRE4n39HrIEhjTf1MLpkv8zGrvKdVFkE';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let orders = [];
let currentTab = 'new';
let notifEnabled = false;

function fmt(ts) {
  return new Date(ts).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
}

async function loadOrders() {
  const { data, error } = await supabase
    .from('orders').select('*').order('created_at', { ascending: false });
  if (!error) { orders = data; render(); }
}

async function markDone(id) {
  await supabase.from('orders').update({ done: true }).eq('id', id);
  orders = orders.map(o => o.id === id ? { ...o, done: true } : o);
  render();
}

function render() {
  const list = currentTab === 'new' ? orders.filter(o => !o.done) : orders;
  const newCount = orders.filter(o => !o.done).length;
  const badge = document.getElementById('new-count');
  if (newCount > 0) { badge.style.display = 'inline'; badge.textContent = newCount; }
  else { badge.style.display = 'none'; }

  const content = document.getElementById('content');
  if (list.length === 0) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">🍃</div>注文はまだありません</div>`;
    return;
  }
  content.innerHTML = list.map(o => `
    <div class="order-card ${!o.done ? 'new-order' : 'done'}">
      <div class="card-top">
        <div class="card-item">
          <div class="card-icon">${o.icon || '🥤'}</div>
          <div>
            <div class="card-name">${o.item}</div>
            <div class="card-temp">${o.temp || ''}</div>
          </div>
        </div>
        <div class="card-badges">
          <span class="${o.done ? 'badge-done' : 'badge-new'}">${o.done ? '提供済み' : '新着'}</span>
          <span class="card-qty">${o.qty} 杯</span>
        </div>
      </div>
      ${o.note ? `<div class="card-note">📝 ${o.note}</div>` : ''}
      <div class="card-time">${fmt(o.created_at)}</div>
      ${!o.done ? `<button class="done-btn" onclick="markDone(${o.id})">✓ 提供済みにする</button>` : ''}
    </div>
  `).join('');
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-new').className = 'tab' + (tab === 'new' ? ' active' : '');
  document.getElementById('tab-all').className = 'tab' + (tab === 'all' ? ' active' : '');
  render();
}

function showBanner(text) {
  const old = document.querySelector('.new-banner');
  if (old) old.remove();
  const el = document.createElement('div');
  el.className = 'new-banner';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

async function requestNotif() {
  if (!('Notification' in window)) { alert('このブラウザは通知に対応していません'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    notifEnabled = true;
    const btn = document.getElementById('notif-btn');
    btn.textContent = '🔔 通知オン中';
    btn.classList.add('on');
  }
}

function sendNotif(order) {
  if (notifEnabled && Notification.permission === 'granted') {
    new Notification('🔔 新しいご注文', {
      body: `${order.icon} ${order.item}（${order.temp}）× ${order.qty}杯${order.note ? '\n' + order.note : ''}`,
      icon: '/favicon.ico'
    });
  }
}

// リアルタイム受信
supabase.channel('orders-channel')
  .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
    const newOrder = payload.new;
    orders.unshift(newOrder);
    render();
    showBanner(`新着：${newOrder.icon} ${newOrder.item} × ${newOrder.qty}杯`);
    sendNotif(newOrder);
    // 通知音（ビープ音）
    try {
      const ctx = new AudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.start(); osc.stop(ctx.currentTime + 0.4);
    } catch(e) {}
  })
  .subscribe();

loadOrders();
</script>
</body>
</html>
