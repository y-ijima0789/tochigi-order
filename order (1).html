<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>お飲み物のご注文 | 栃木建築社</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1510; --ink-light: #5a5248; --ink-muted: #9a9290;
    --paper: #faf8f4; --paper-warm: #f2ede4; --paper-mid: #e8e2d8;
    --accent: #6b4c2a; --accent-light: #c8a882; --accent-subtle: #f0e8da;
    --green: #3a5a3a; --green-light: #edf4ed; --border: rgba(107,76,42,0.18); --r: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; background: var(--paper); color: var(--ink); font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }
  .screen { display: none; }
  .screen.active { display: block; }
  .header {
    background: var(--accent); color: var(--paper);
    text-align: center; padding: 2rem 1.5rem 1.5rem; position: relative; overflow: hidden;
  }
  .header::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, transparent, transparent 12px, rgba(255,255,255,0.03) 12px, rgba(255,255,255,0.03) 13px); }
  .header-kana { font-size: 10px; letter-spacing: 0.3em; color: var(--accent-light); margin-bottom: 6px; }
  .header-title { font-family: 'Noto Serif JP', serif; font-size: 20px; font-weight: 500; letter-spacing: 0.12em; }
  .header-sub { font-size: 11px; color: var(--accent-light); margin-top: 6px; letter-spacing: 0.15em; }
  .section { padding: 1.25rem 1.25rem 0; }
  .section-label { font-size: 10px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; font-weight: 500; display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; }
  .section-label::after { content: ''; flex: 1; height: 0.5px; background: var(--border); }
  .menu-list { padding: 0 1.25rem; display: flex; flex-direction: column; gap: 8px; }
  .menu-item { background: var(--paper); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: background 0.15s, border-color 0.15s; user-select: none; }
  .menu-item.selected { background: var(--accent-subtle); border-color: var(--accent-light); }
  .menu-item-icon { font-size: 24px; width: 36px; text-align: center; flex-shrink: 0; }
  .menu-item-name { font-size: 15px; font-weight: 400; color: var(--ink); }
  .menu-item-desc { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
  .menu-item-check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--paper-mid); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; margin-left: auto; }
  .menu-item.selected .menu-item-check { background: var(--accent); border-color: var(--accent); color: white; }
  .options-row { padding: 0 1.25rem; display: flex; gap: 8px; flex-wrap: wrap; }
  .option-chip { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); font-size: 12px; cursor: pointer; background: var(--paper); color: var(--ink-light); user-select: none; }
  .option-chip.selected { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 500; }
  .qty-row { margin: 0 1.25rem; background: var(--paper-warm); border-radius: var(--r); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  .qty-label { font-size: 13px; color: var(--ink-light); }
  .qty-ctrl { display: flex; align-items: center; gap: 16px; }
  .qty-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: var(--paper); font-size: 20px; cursor: pointer; color: var(--ink); display: flex; align-items: center; justify-content: center; line-height: 1; }
  .qty-num { font-size: 18px; font-weight: 500; min-width: 24px; text-align: center; }
  .note-wrap { padding: 0 1.25rem; }
  .note-input { width: 100%; border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; font-size: 14px; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; color: var(--ink); background: var(--paper); resize: none; height: 70px; outline: none; }
  .note-input::placeholder { color: var(--ink-muted); }
  .order-wrap { padding: 1.25rem; padding-bottom: 2.5rem; }
  .order-btn { width: 100%; padding: 16px; background: var(--accent); color: var(--paper); border: none; border-radius: var(--r); font-family: 'Noto Serif JP', serif; font-size: 15px; font-weight: 500; letter-spacing: 0.1em; cursor: pointer; }
  .order-btn:disabled { background: var(--paper-mid); color: var(--ink-muted); cursor: default; }
  .success-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 2rem; text-align: center; }
  .success-circle { width: 80px; height: 80px; border-radius: 50%; background: var(--green-light); border: 2px solid rgba(58,90,58,0.2); display: flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 1.5rem; animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1); }
  @keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .success-title { font-family: 'Noto Serif JP', serif; font-size: 20px; font-weight: 500; color: var(--green); margin-bottom: 10px; }
  .success-body { font-size: 14px; color: var(--ink-light); line-height: 1.8; }
  .success-card { margin: 1.5rem 0; background: var(--paper-warm); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 20px; width: 100%; max-width: 300px; text-align: left; }
  .success-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .success-row:last-child { margin-bottom: 0; }
  .success-label { color: var(--ink-muted); }
  .success-value { font-weight: 500; color: var(--ink); }
  .back-btn { margin-top: 0.5rem; padding: 10px 24px; border: 1px solid var(--border); border-radius: 999px; background: transparent; color: var(--ink-light); font-size: 13px; cursor: pointer; }
</style>
</head>
<body>

<div id="menu-screen" class="screen active">
  <div class="header">
    <div class="header-kana">とちぎけんちくしゃ</div>
    <div class="header-title">栃木建築社</div>
    <div class="header-sub">お飲み物のご注文</div>
  </div>
  <div class="section" style="margin-top:1.25rem;"><div class="section-label">メニュー</div></div>
  <div class="menu-list" id="menu-list"></div>
  <div class="section" style="margin-top:1.25rem;"><div class="section-label">アイス / ホット</div></div>
  <div class="options-row" id="temp-options">
    <div class="option-chip selected" data-val="hot" onclick="selectTemp(this)">ホット</div>
    <div class="option-chip" data-val="ice" onclick="selectTemp(this)">アイス</div>
    <div class="option-chip" data-val="either" onclick="selectTemp(this)">おまかせ</div>
  </div>
  <div class="section" style="margin-top:1.25rem;"><div class="section-label">数量</div></div>
  <div class="qty-row">
    <span class="qty-label">お飲み物の数</span>
    <div class="qty-ctrl">
      <button class="qty-btn" onclick="changeQty(-1)">−</button>
      <span class="qty-num" id="qty-num">1</span>
      <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
  </div>
  <div class="section" style="margin-top:1.25rem;"><div class="section-label">ご要望・備考</div></div>
  <div class="note-wrap">
    <textarea class="note-input" id="note" placeholder="アレルギーや特別なご要望があればご記入ください（例：砂糖なし、薄め）"></textarea>
  </div>
  <div class="order-wrap">
    <button class="order-btn" id="order-btn" disabled onclick="submitOrder()">ご注文を確定する</button>
  </div>
</div>

<div id="success-screen" class="screen">
  <div class="success-screen">
    <div class="success-circle">✓</div>
    <div class="success-title">ご注文を承りました</div>
    <div class="success-body">まもなくお持ちいたします。<br>ごゆっくりお待ちください。</div>
    <div class="success-card" id="order-summary"></div>
    <button class="back-btn" onclick="resetOrder()">追加注文する</button>
  </div>
</div>

<script>
const MENU = [
  { id: 'coffee',    icon: '☕', name: 'コーヒー',         desc: 'ブレンドコーヒー' },
  { id: 'tea',       icon: '🍵', name: '緑茶',            desc: '栃木産' },
  { id: 'black-tea', icon: '🫖', name: '紅茶',            desc: 'アールグレイ' },
  { id: 'water',     icon: '💧', name: 'お水',            desc: 'ミネラルウォーター' },
  { id: 'juice-o',   icon: '🍊', name: 'オレンジジュース', desc: '100% ストレート' },
  { id: 'juice-a',   icon: '🍎', name: 'アップルジュース', desc: '100% ストレート' },
  { id: 'milk',      icon: '🥛', name: 'ミルク',           desc: '温・冷 選べます' },
  { id: 'cocoa',     icon: '🍫', name: 'ホットココア',     desc: 'まろやか' },
  { id: 'soda',      icon: '🥤', name: 'コーラ',           desc: 'Coca-Cola' },
  { id: 'ginger',    icon: '🫧', name: 'ジンジャーエール', desc: 'カナダドライ' },
];

const SUPABASE_URL = 'https://jdykbvsvvbrdrfrffwwa.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkeWtidnN2dmJyZHJmcmZmd3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyODQ4OTMsImV4cCI6MjA5MDg2MDg5M30.rYE4w0j2WBGhRE4n39HrIEhjTf1MLpkv8zGrvKdVFkE';

let selectedId = null, selectedTemp = 'hot', qty = 1;

function renderMenu() {
  document.getElementById('menu-list').innerHTML = MENU.map(item => `
    <div class="menu-item ${selectedId === item.id ? 'selected' : ''}" onclick="selectItem('${item.id}')">
      <div class="menu-item-icon">${item.icon}</div>
      <div>
        <div class="menu-item-name">${item.name}</div>
        <div class="menu-item-desc">${item.desc}</div>
      </div>
      <div class="menu-item-check">${selectedId === item.id ? '✓' : ''}</div>
    </div>
  `).join('');
}

function selectItem(id) {
  selectedId = id; renderMenu();
  document.getElementById('order-btn').disabled = false;
}

function selectTemp(el) {
  document.querySelectorAll('#temp-options .option-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected'); selectedTemp = el.dataset.val;
}

function changeQty(d) {
  qty = Math.max(1, Math.min(5, qty + d));
  document.getElementById('qty-num').textContent = qty;
}

async function submitOrder() {
  if (!selectedId) return;
  const btn = document.getElementById('order-btn');
  btn.disabled = true; btn.textContent = '送信中...';
  const item = MENU.find(m => m.id === selectedId);
  const note = document.getElementById('note').value.trim();
  const tempLabel = { hot: 'ホット', ice: 'アイス', either: 'おまかせ' }[selectedTemp];

  try {
    await fetch(`${SUPABASE_URL}/rest/v1/orders`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify({ item: item.name, icon: item.icon, temp: tempLabel, qty, note })
    });
  } catch(e) { console.warn(e); }

  document.getElementById('order-summary').innerHTML = `
    <div class="success-row"><span class="success-label">ご注文</span><span class="success-value">${item.icon} ${item.name}</span></div>
    <div class="success-row"><span class="success-label">温度</span><span class="success-value">${tempLabel}</span></div>
    <div class="success-row"><span class="success-label">数量</span><span class="success-value">${qty} 杯</span></div>
    ${note ? `<div class="success-row"><span class="success-label">備考</span><span class="success-value">${note}</span></div>` : ''}
  `;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('success-screen').classList.add('active');
  window.scrollTo(0, 0);
}

function resetOrder() {
  selectedId = null; qty = 1; selectedTemp = 'hot';
  document.getElementById('note').value = '';
  document.getElementById('qty-num').textContent = '1';
  document.querySelectorAll('#temp-options .option-chip').forEach((c,i) => c.classList.toggle('selected', i===0));
  const btn = document.getElementById('order-btn');
  btn.disabled = true; btn.textContent = 'ご注文を確定する';
  renderMenu();
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('menu-screen').classList.add('active');
  window.scrollTo(0, 0);
}

renderMenu();
</script>
</body>
</html>
